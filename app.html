<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABN — ניהול מוסך</title>
<style>

:root{
 --red:#ED1E24;        /* exact logo red */
 --red-dk:#B3161B;
 --steel:#5A6472;      /* gear steel */
 --steel-lt:#8A94A3;
 --ink:#161A22;        /* logo black ring */
 --ink-2:#232A38;
 --paper:#EDF0F4;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:var(--paper);color:var(--ink);direction:rtl;font-size:14px}
.bar{background:linear-gradient(135deg,var(--ink) 0%,var(--ink-2) 55%,#2E3646 100%);color:#fff;border-bottom:3px solid var(--red);padding:9px 15px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:40}
.bar h1{font-size:17px;font-weight:bold;white-space:nowrap}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:7px;padding:6px 12px;cursor:pointer;font-size:13.5px}
.nav button.on{background:var(--red);color:#fff;box-shadow:0 2px 8px rgba(237,30,36,.45);font-weight:bold;border-color:#fff}
.bar input{flex:1;min-width:150px;padding:8px 11px;border:0;border-radius:8px;font-size:14px}
.bar .b2{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13.5px}
.bar .b2:hover{background:rgba(255,255,255,.3)}
.bar .st{font-size:12px;opacity:.85;white-space:nowrap}
.tabs{display:flex;gap:6px;padding:10px 15px;flex-wrap:wrap;background:#fff;border-bottom:1px solid #e2e6ee;position:sticky;top:46px;z-index:35}
.tabs button{background:#f2f4f9;border:1px solid #e2e6ee;border-radius:18px;padding:6px 13px;cursor:pointer;font-size:13px;color:#3a4152;white-space:nowrap}
.tabs button.on{background:var(--red);color:#fff;border-color:var(--red);box-shadow:0 2px 7px rgba(237,30,36,.3);font-weight:bold}
.tabs .c{opacity:.72;font-size:11.5px;margin-inline-start:4px}
.wrap{padding:12px 15px 40px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:11px;overflow:hidden;box-shadow:0 1px 4px rgba(20,25,45,.07)}
th{background:#F4F6F9;padding:9px;text-align:right;font-size:12.5px;color:#5b6172;border-bottom:2px solid #e2e6ee;white-space:nowrap}
td{padding:9px;border-bottom:1px solid #f0f2f7;font-size:13.5px}
tr.r{cursor:pointer}tr.r:hover td{background:#FDF2F2}
.pill{display:inline-block;padding:3px 9px;border-radius:11px;font-size:12px;font-weight:bold;white-space:nowrap}
.muted{color:#8a90a0}.empty{text-align:center;padding:40px;color:#8a90a0}
.ov{position:fixed;inset:0;background:rgba(15,19,32,.5);display:none;z-index:60;overflow:auto;padding:16px}
.ov.on{display:block}
.md{max-width:880px;margin:0 auto;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.mh{background:linear-gradient(135deg,var(--ink) 0%,var(--ink-2) 100%);border-bottom:3px solid var(--red);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:6}
.mh .t{flex:1}.mh .t b{font-size:16px}.mh .t span{display:block;font-size:12.5px;opacity:.85;margin-top:2px}
.mh button{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:6px 11px;cursor:pointer}
.mt{display:flex;gap:4px;padding:8px 12px 0;background:#f7f9fc;border-bottom:1px solid #e2e6ee;flex-wrap:wrap;position:sticky;top:50px;z-index:5}
.mt button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;font-size:14px;color:#5b6172}
.mt button.on{color:var(--red);border-bottom-color:var(--red);font-weight:bold}
.pane{display:none;padding:14px 16px}.pane.on{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px 14px}
@media(max-width:720px){.grid,.g3{grid-template-columns:1fr}.md{max-width:100%}}
.f label{display:block;font-size:12px;color:#5b6172;margin-bottom:3px}
.f .v{font-size:14px;padding:6px 0;min-height:28px}
.f select,.f input,.f textarea{width:100%;padding:7px 9px;border:1px solid #cfd5e0;border-radius:7px;font-size:14px;font-family:inherit;background:#fff}
.f textarea{min-height:64px;resize:vertical}
.sec{font-size:14px;font-weight:bold;margin:16px 0 8px;padding-bottom:5px;border-bottom:2px solid var(--red);color:var(--ink);letter-spacing:.2px}
.chk{display:flex;align-items:center;gap:8px;padding:8px 9px;border:1px solid #e2e6ee;border-radius:8px;cursor:pointer;font-size:13.5px;background:#fff}
.chk:hover{background:#f7f9fc}.chk.on{background:#e8f6ea;border-color:#a8ddb4}
.chk input{width:17px;height:17px;cursor:pointer;flex:0 0 auto}
.hd{display:flex;gap:6px;padding:0 0 6px;border-bottom:2px solid #1d2130;font-size:12px;font-weight:bold;color:#5b6172}
.hd .nm{flex:1}.hd .c1{width:60px;text-align:center}.hd .c2{width:82px;text-align:center}.hd .c3{width:70px;text-align:center}.hd .c4{width:32px}
.ln{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid #eef0f5}
.ln .nm{flex:1;font-size:13.5px;line-height:1.35}
.ln .nm small{display:block;color:#ED1E24;font-size:11.5px}
.ln input{width:60px;padding:6px;text-align:center;border:1px solid #cfd5e0;border-radius:7px;font-size:14px}
.ln input.pr{width:82px}.ln .lt{width:70px;text-align:center;font-size:13px;font-weight:bold}
.ln .x{width:32px;background:#fff;border:1px solid #e0d0d3;color:#ED1E24;border-radius:7px;padding:5px 0;cursor:pointer}
.srch{position:relative;margin-top:10px}
.srch input{width:100%;padding:11px;border:1.5px solid var(--red);border-radius:9px;font-size:14.5px}
.dd{position:absolute;top:100%;right:0;left:0;background:#fff;border:1px solid #dfe3ea;border-radius:9px;max-height:240px;overflow:auto;z-index:20;display:none;box-shadow:0 8px 22px rgba(0,0,0,.13)}
.dd.on{display:block}
.dd div{padding:10px 12px;cursor:pointer;border-bottom:1px solid #f2f4f8}
.dd div:hover{background:#fdecef}
.tot{display:flex;justify-content:space-between;font-weight:bold;padding-top:10px;margin-top:8px;border-top:2px solid #1d2130;font-size:15px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1d7a33;color:#fff;padding:10px 18px;border-radius:9px;z-index:99;display:none;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.toast.err{background:#ED1E24}.toast.on{display:block}

/* --- Airtable colour palette (exact) --- */
.at-blueLight2{background:#cfdfff;color:#2750ae}
.at-cyanLight2{background:#d0f0fd;color:#0b76b7}
.at-tealLight2{background:#c2f5e9;color:#06a09b}
.at-greenLight2{background:#d1f7c4;color:#338a17}
.at-yellowLight2{background:#ffeab6;color:#b87503}
.at-orangeLight2{background:#fee2d5;color:#d74d26}
.at-redLight2{background:#ffdce5;color:#d31b5c}
.at-pinkLight2{background:#ffdaf6;color:#b2158b}
.at-yellowBright{background:#fcb400;color:#fff}
.at-orangeBright{background:#ff6f2c;color:#fff}
.at-blueBright{background:#2d7ff9;color:#fff}
.at-greenBright{background:#20c933;color:#fff}
.at-redBright{background:#f82b60;color:#fff}
.at-gray{background:#eef1f5;color:#5b6172}
/* --- brand --- */
.brand{display:flex;align-items:center;gap:9px;white-space:nowrap}
.brand .mark{height:38px;width:auto;flex:0 0 auto;display:block;
   background:#fff;padding:3px 7px;border-radius:8px;box-shadow:0 2px 9px rgba(0,0,0,.28)}
.brand .nm{line-height:1.15}
.brand .nm b{display:block;font-size:15.5px;letter-spacing:.3px}
.brand .nm span{display:block;font-size:10.5px;opacity:.85;letter-spacing:.6px}
.bar{box-shadow:0 3px 14px rgba(22,26,34,.32)}
.tabs{box-shadow:0 1px 3px rgba(20,25,45,.05)}
table{box-shadow:0 2px 10px rgba(20,25,45,.08)}
tr.r{transition:background .12s}
.md{animation:pop .16s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}
.f select:focus,.f input:focus,.f textarea:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(237,30,36,.16)}
.ln input:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(237,30,36,.16)}
.sm{display:flex;justify-content:space-between;padding:4px 0;font-size:14.5px}
.boot{text-align:center;padding:60px 20px;color:#5b6172}.boot .sp{font-size:32px}
.hint{background:#eef4fd;border-right:4px solid #1246a0;padding:9px 12px;border-radius:8px;font-size:13px;color:#1246a0;margin-bottom:12px}
.save{background:#1B7F35;color:#fff;border:0;border-radius:9px;padding:11px 20px;font-size:15px;font-weight:bold;cursor:pointer;width:100%;margin-top:14px}
.save:disabled{background:#9bb7a2}
</style>

function patchWO(fields,rd,note){
  var rid=CUR.id;
  Object.keys(fields).forEach(function(k){CUR.fields[k]=fields[k];});
  if(rd)rd();draw();drawTabs();
  fetch(PX+B+"/"+T.wo+"/"+rid,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:fields,typecast:true})})
   .then(function(r){return r.ok?r.json():Promise.reject();})
   .then(function(d){var i=-1;WOS.forEach(function(x,n){if(x.id===d.id)i=n;});if(i>=0)WOS[i]=d;
     if(CUR&&CUR.id===d.id)CUR=d;
     toast("✓ נשמר"+(note?" · "+note:""));draw();drawTabs();
     if(note)refetchCard(rid,0);})
   .catch(function(){toast("השמירה נכשלה — רענן",1);});}
var ORDER=["חדש","מחכה לטיפול","בטיפול","מוכן לתשלום","שולם"];
function statusNote(from,to){
  if(to==="מוכן לתשלום")return "נשלחה הודעה ללקוח · נקבע תאריך סגירה";
  if(to==="בוטל")return "הסלוט ביומן שוחרר";
  if(to==="בטיפול")return "נקבע תאריך פתיחה";
  if(to==="שולם"&&ORDER.indexOf(from)<ORDER.indexOf("מוכן לתשלום"))return "לא נשלחה הודעה ללקוח";
  return "";
}
function setF2(fld,v){
  if(fld==="סטטוס"){
    var from=txt((CUR.fields||{})["סטטוס"]);
    if(v==="שולם"&&ORDER.indexOf(from)>=0&&ORDER.indexOf(from)<ORDER.indexOf("מוכן לתשלום")){
      if(!confirm("הכרטיס עובר ל\"שולם\" בלי לעבור ב\"מוכן לתשלום\".\n\nהלקוח לא יקבל הודעת וואטסאפ ולא ייקבע תאריך סגירה.\n\nלהמשיך?")){pDet();return;}
    }

/* re-read the record after Airtable automations have run */
function refetchCard(id,tries){
  tries=tries||0;
  setTimeout(function(){
    fetch(PX+B+"/"+T.wo+"/"+id).then(function(r){return r.ok?r.json():Promise.reject();})
     .then(function(d){
       var i=-1;WOS.forEach(function(x,n){if(x.id===d.id)i=n;});if(i>=0)WOS[i]=d;
       if(CUR&&CUR.id===d.id){CUR=d;pDet();pPay();pChecks();pSvc();
         if(d.fields["⚠️ התראה"])toast("⚠️ "+d.fields["⚠️ התראה"],1);}
       draw();drawTabs();
       if(tries<1)refetchCard(id,tries+1);
     }).catch(function(){});
  },tries===0?2200:4000);
}

function normPhone(v){return String(v||"").replace(/[^0-9]/g,"");}
function validPhone(v){var d=normPhone(v);return d.length===10&&d.slice(0,2)==="05";}
function validPlate(v){var d=normPhone(v);return d.length===7||d.length===8;}
function fmtPlate(v){var d=normPhone(v);
 if(d.length===8)return d.slice(0,3)+"-"+d.slice(3,5)+"-"+d.slice(5);
 if(d.length===7)return d.slice(0,2)+"-"+d.slice(2,5)+"-"+d.slice(5);return d;}

function newCusForm(){
  document.getElementById("p0").innerHTML='<div class="sec" style="margin-top:0">לקוח חדש</div>'
   +'<div class="grid">'
   +'<div class="f"><label>שם מלא *</label><input id="ncnName" oninput="cusDupCheck()"></div>'
   +'<div class="f"><label>טלפון נייד *</label><input id="ncnPhone" placeholder="05XXXXXXXX" oninput="cusDupCheck()"></div>'
   +'<div class="f"><label>דוא"ל</label><input id="ncnMail" type="email"></div>'
   +'<div class="f"><label>כתובת</label><input id="ncnAddr"></div>'
   +'</div><div id="dupBox"></div>'
   +'<button class="save" id="ncnSave" onclick="createCustomer()">✓ צור לקוח</button>'
   +'<button class="save" style="background:#5b6172;margin-top:8px" onclick="newCard()">← חזרה</button>';
  window.__dupList=[];
}
async function cusDupCheck(){
  var nm=(document.getElementById("ncnName").value||"").trim();
  var ph=normPhone(document.getElementById("ncnPhone").value);
  var box=document.getElementById("dupBox"); if(!box)return;
  if(ph.length<9&&nm.length<2){box.innerHTML="";window.__dupList=[];return;}
  try{
    var f=[];
    if(ph.length>=9)f.push('SEARCH("'+ph.slice(-9)+'",SUBSTITUTE({מספר טלפון},"-",""))');
    if(nm.length>=2)f.push('SEARCH("'+nm.replace(/"/g,'')+'",{שם לקוח})');
    var recs=await find(T.cus,'OR('+f.join(",")+')',10);
    window.__dupList=recs;
    if(!recs.length){box.innerHTML='<div class="hint" style="background:#e8f6ea;border-color:#1d7a33;color:#1d7a33">✓ לא נמצא לקוח קיים דומה</div>';return;}
    var exactSame=recs.filter(function(r){var g=r.fields||{};
      return (g["שם לקוח"]||"").trim()===nm && normPhone(g["מספר טלפון"]).slice(-9)===ph.slice(-9);});
    box.innerHTML='<div class="hint">'+(exactSame.length
       ?'⚠️ קיים כבר לקוח <b>עם אותו שם ואותו טלפון</b> — כנראה אותו אדם. בחר אותו במקום ליצור כפילות.'
       :'נמצאו לקוחות עם טלפון או שם דומים. <b>טלפון משותף אינו כפילות</b> — משפחות ועסקים חולקים קו. בחר קיים רק אם זה באמת אותו אדם.')+'</div>'
     +recs.map(function(r){var g=r.fields||{};
       return '<div class="ln"><div class="nm"><b>'+esc(g["שם לקוח"]||"")+'</b><small style="color:#5b6172">'+esc(g["מספר טלפון"]||"")+' · '+esc(txt(g["מספר רכבים"]))+' רכבים</small></div>'
        +'<button class="x" style="width:auto;padding:5px 10px;color:#1d7a33;border-color:#a8ddb4" onclick="useExistingCus(\''+r.id+'\',\''+esc((g["שם לקוח"]||"")+" · "+(g["מספר טלפון"]||"")).replace(/\'/g,"")+'\')">זה הוא</button></div>';}).join("");
  }catch(e){box.innerHTML='<div class="hint">בדיקת הכפילויות נכשלה — אפשר להמשיך</div>';}
}
function useExistingCus(id,lbl){window.__ncCus=id;newCard();
 setTimeout(function(){var el=document.getElementById("ncCusPick");if(el)el.textContent="✓ "+lbl;},120);
 toast("✓ נבחר לקוח קיים");}
function createCustomer(){
  var nm=(document.getElementById("ncnName").value||"").trim();
  var ph=(document.getElementById("ncnPhone").value||"").trim();
  if(nm.length<2){toast("צריך שם מלא",1);return;}
  if(!validPhone(ph)){toast("טלפון נייד לא תקין — 10 ספרות שמתחילות ב-05",1);return;}
  var b={fields:{},typecast:true};
  b.fields["שם לקוח"]=nm; b.fields["מספר טלפון"]=normPhone(ph);
  var m=document.getElementById("ncnMail").value.trim(); if(m)b.fields['דוא"ל']=m;
  var a=document.getElementById("ncnAddr").value.trim(); if(a)b.fields["כתובת"]=a;
  b.fields["סטטוס לקוח"]="מחכה לאישור";
  var btn=document.getElementById("ncnSave");btn.disabled=true;btn.textContent="יוצר…";
  fetch(PX+B+"/"+T.cus,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)})
   .then(function(r){return r.ok?r.json():Promise.reject();})
   .then(function(rec){window.__ncCus=rec.id;toast("✓ נוצר לקוח "+nm);newCard();
     setTimeout(function(){var el=document.getElementById("ncCusPick");if(el)el.textContent="✓ "+nm+" · "+normPhone(ph);},120);})
   .catch(function(){btn.disabled=false;btn.textContent="✓ צור לקוח";toast("היצירה נכשלה",1);});
}

function newVehForm(){
  document.getElementById("p0").innerHTML='<div class="sec" style="margin-top:0">רכב חדש</div>'
   +'<div class="hint">לאחר היצירה, פרטי הרכב יושלמו אוטומטית מרשם הרכב (gov.il).</div>'
   +'<div class="grid">'
   +'<div class="f"><label>מספר רכב * (7 או 8 ספרות)</label><input id="nvPlate" oninput="vehDupCheck()"></div>'
   +'<div class="f"><label>קוד רכב (קוד התנעה)</label><input id="nvCode"></div>'
   +'</div><div id="vdupBox"></div>'
   +'<button class="save" id="nvSave" onclick="createVehicle()">✓ צור רכב</button>'
   +'<button class="save" style="background:#5b6172;margin-top:8px" onclick="newCard()">← חזרה</button>';
}
async function vehDupCheck(){
  var pl=normPhone(document.getElementById("nvPlate").value);
  var box=document.getElementById("vdupBox"); if(!box)return;
  if(pl.length<6){box.innerHTML="";return;}
  if(!validPlate(pl)){box.innerHTML='<div class="hint" style="background:#fdecec;border-color:#ED1E24;color:#8a1220">⚠️ מספר רכב חייב להיות 7 או 8 ספרות</div>';return;}
  try{
    var recs=await find(T.veh,'SEARCH("'+pl+'",SUBSTITUTE({מספר רכב},"-",""))',5);
    if(recs.length){var g=recs[0].fields||{};
      box.innerHTML='<div class="hint" style="background:#fdecec;border-color:#ED1E24;color:#8a1220">⚠️ הרכב כבר קיים במערכת</div>'
       +'<div class="ln"><div class="nm"><b>'+esc(g["מספר רכב"]||"")+'</b><small style="color:#5b6172">'+esc((g["יצרן (מלל חופשי)"]||"")+" "+(g["דגם (מלל חופשי)"]||""))+'</small></div>'
       +'<button class="x" style="width:auto;padding:5px 10px;color:#1d7a33;border-color:#a8ddb4" onclick="useExistingVeh(\''+recs[0].id+'\',\''+esc(g["מספר רכב"]||"").replace(/\'/g,"")+'\')">בחר אותו</button></div>';
    } else box.innerHTML='<div class="hint" style="background:#e8f6ea;border-color:#1d7a33;color:#1d7a33">✓ מספר רכב פנוי · '+esc(fmtPlate(pl))+'</div>';
  }catch(e){box.innerHTML="";}
}
function useExistingVeh(id,lbl){window.__ncVeh=id;newCard();
 setTimeout(function(){var el=document.getElementById("ncVehPick");if(el)el.textContent="✓ "+lbl;},120);
 toast("✓ נבחר רכב קיים");}
function createVehicle(){
  var pl=normPhone(document.getElementById("nvPlate").value);
  if(!validPlate(pl)){toast("מספר רכב חייב 7 או 8 ספרות",1);return;}
  if(!window.__ncCus){toast("צריך לבחור לקוח קודם",1);return;}
  var b={fields:{},typecast:true};
  b.fields["מספר רכב"]=fmtPlate(pl);
  b.fields["לקוח"]=[window.__ncCus];
  var c=document.getElementById("nvCode").value.trim(); if(c)b.fields["קוד רכב"]=c;
  var btn=document.getElementById("nvSave");btn.disabled=true;btn.textContent="יוצר…";
  fetch(PX+B+"/"+T.veh,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)})
   .then(function(r){return r.ok?r.json():Promise.reject();})
   .then(function(rec){window.__ncVeh=rec.id;toast("✓ נוצר רכב — פרטיו יושלמו מגוב.יל");newCard();
     setTimeout(function(){var el=document.getElementById("ncVehPick");if(el)el.textContent="✓ "+fmtPlate(pl);},120);})
   .catch(function(){btn.disabled=false;btn.textContent="✓ צור רכב";toast("היצירה נכשלה",1);});
}
function newCard(){
  CUR=null;
  document.getElementById("mT").textContent="כרטיס עבודה חדש";
  document.getElementById("mS").textContent="חפש לקוח ורכב קיימים";
  document.getElementById("mTabs").innerHTML="";
  document.getElementById("p0").className="pane on";[1,2,3,4].forEach(function(n){document.getElementById("p"+n).className="pane";});
  document.getElementById("p0").innerHTML='<div class="hint">בחר לקוח ורכב קיימים. אם הם לא קיימים — צור אותם קודם ב-Airtable.</div>'
   +'<div class="srch" style="margin-top:0"><input id="ncCus" placeholder="🔍 חפש לקוח (שם או טלפון)…" autocomplete="off" oninput="ncSearch(\'cus\')"><div class="dd" id="ddCus"></div></div>'
   +'<div class="f" style="margin-top:6px"><div class="v" id="ncCusPick">— לא נבחר לקוח —</div></div>'+'<button class="x" style="width:auto;padding:7px 13px;margin-bottom:8px" onclick="newCusForm()">+ לקוח חדש</button>'
   +'<div class="srch"><input id="ncVeh" placeholder="🔍 חפש רכב (מספר רכב)…" autocomplete="off" oninput="ncSearch(\'veh\')"><div class="dd" id="ddVeh"></div></div>'
   +'<div class="f" style="margin-top:6px"><div class="v" id="ncVehPick">— לא נבחר רכב —</div></div>'+'<button class="x" style="width:auto;padding:7px 13px;margin-bottom:8px" onclick="newVehForm()">+ רכב חדש</button>'
   +'<div class="grid" style="margin-top:12px">'
   +'<div class="f"><label>תאריך ושעה</label><input type="datetime-local" id="ncDate"></div>'
   +'<div class="f"><label>סוג טיפול</label><select id="ncType"><option value=""></option>'+TREAT.map(function(t){return '<option>'+esc(t)+'</option>';}).join("")+'</select></div>'
   +'<div class="f"><label>מכונאי אחראי</label><select id="ncEmp"><option value=""></option>'+EMP.map(function(e){return '<option value="'+e.id+'">'+esc(e.name)+'</option>';}).join("")+'</select></div>'
   +'<div class="f"><label>קילומטראז\'</label><input type="number" id="ncKm"></div>'
   +'</div><div class="f"><label>סיבת הגעה</label><textarea id="ncReason"></textarea></div>'
   +'<button class="save" id="ncSave" onclick="createCard()">✓ צור כרטיס עבודה</button>';
  if(window.__keepPicks!==true){window.__ncCus=window.__ncCus||null;window.__ncVeh=window.__ncVeh||null;}
  document.getElementById("ov").classList.add("on");
}
async function ncSearch(kind){
  var inp=document.getElementById(kind==="cus"?"ncCus":"ncVeh"), dd=document.getElementById(kind==="cus"?"ddCus":"ddVeh");
  var s=(inp.value||"").trim(); if(s.length<2){dd.classList.remove("on");return;}
  dd.innerHTML='<div class="muted">מחפש…</div>';dd.classList.add("on");
  try{
    var recs=kind==="cus"
      ? await find(T.cus,'OR(SEARCH('+q(s)+',{שם לקוח}),SEARCH('+q(s)+',{מספר טלפון}))',15)
      : await find(T.veh,'SEARCH('+q(s)+',{מספר רכב})',15);
    dd.innerHTML=recs.length?recs.map(function(r){var f=r.fields||{};
      var lbl=kind==="cus"?((f["שם לקוח"]||"")+" · "+(f["מספר טלפון"]||""))
        :((f["מספר רכב"]||"")+" · "+(f["יצרן (מלל חופשי)"]||"")+" "+(f["דגם (מלל חופשי)"]||""));
      return '<div onclick="ncPick(\''+kind+'\',\''+r.id+'\',\''+esc(lbl).replace(/'/g,"")+'\')">'+esc(lbl)+'</div>';}).join("")
     :'<div class="muted">לא נמצא</div>';
  }catch(e){dd.innerHTML='<div class="muted">החיפוש נכשל</div>';}
}
function ncPick(kind,id,lbl){
  document.getElementById(kind==="cus"?"ddCus":"ddVeh").classList.remove("on");
  document.getElementById(kind==="cus"?"ncCus":"ncVeh").value="";
  if(kind==="cus"){window.__ncCus=id;document.getElementById("ncCusPick").textContent="✓ "+lbl;}
  else{window.__ncVeh=id;document.getElementById("ncVehPick").textContent="✓ "+lbl;}
}
function createCard(){
  if(!window.__ncCus||!window.__ncVeh){toast("צריך לבחור גם לקוח וגם רכב",1);return;}
  var b={fields:{},typecast:true};
  b.fields["שם לקוח"]=[window.__ncCus];
  b.fields["מספר רכב"]=[window.__ncVeh];
  b.fields["סטטוס"]="חדש";
  var d=document.getElementById("ncDate").value; if(d)b.fields["תאריך ושעה"]=d;
  var t=document.getElementById("ncType").value; if(t)b.fields["סוג טיפול"]=t;
  var e=document.getElementById("ncEmp").value; if(e)b.fields["מכונאי אחראי"]=[e];
  var km=parseFloat(document.getElementById("ncKm").value); if(!isNaN(km))b.fields["עדכון קילומטרז' ידני"]=km;
  var rs=document.getElementById("ncReason").value; if(rs)b.fields["סיבת הגעה"]=rs;
  var btn=document.getElementById("ncSave");btn.disabled=true;btn.textContent="יוצר…";
  fetch(PX+B+"/"+T.wo,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)})
   .then(function(r){return r.ok?r.json():Promise.reject();})
   .then(function(rec){WOS.push(rec);drawTabs();draw();toast("✓ נוצר כרטיס "+(rec.fields["מספר כרטיס עבודה"]||""));
     closeCard();setTimeout(function(){openCard(rec.id);},400);})
   .catch(function(){btn.disabled=false;btn.textContent="✓ צור כרטיס עבודה";toast("היצירה נכשלה",1);});
}

/* ============ BOOT ============ */
async function boot(){
  drawNav();
  try{WOS=await all(T.wo);drawTabs();draw();document.getElementById("stamp").textContent=WOS.length+" כרטיסים";}
  catch(e){document.getElementById("list").innerHTML='<div class="empty">שגיאה בטעינה: '+esc(String(e.message||e))+'</div>';return;}
  try{LINES=await all(T.ln);if(CUR)pParts();}catch(e){}
  try{SVC=(await all(T.svc)).map(function(r){var f=r.fields||{};return {id:r.id,name:f["שם שירות"]||"",price:f["מחיר שירות"]||0};});}catch(e){}
  try{LOC=(await all(T.loc)).map(function(r){return {id:r.id,name:(r.fields||{})["שם מיקום"]||""};});}catch(e){}
  try{EMP=(await all(T.emp)).map(function(r){var f=r.fields||{};return {id:r.id,name:f["שם מלא"]||"",role:txt(f["תפקיד"]),status:txt(f["סטטוס"]),cards:f["מספר כרטיסי עבודה"]||0};});}catch(e){}
  if(VIEW!=="work")draw();
  document.getElementById("stamp").textContent=WOS.length+" כרטיסים · "+EMP.length+" עובדים";
}
function reload(){document.getElementById("list").innerHTML='<div class="boot"><div class="sp">⏳</div><div style="margin-top:10px">מרענן…</div></div>';boot();}
boot();
</script>
</body>
