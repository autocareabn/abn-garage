    EMP=rs.map(function(r){var f=r.fields||{};return {id:r.id,name:f["שם מלא"]||f["שם עובד"]||f["שם"]||"",email:txt(f["אימייל"]||f["Email"]||f["דוא\"ל"]||""),role:txt(f["תפקיד"]),status:txt(f["סטטוס"]),cards:f["מספר כרטיסי עבודה"]||0,raw:r};});
    if(VIEW==="set")draw();
  });
}
/* ============ BOOT ============ */
async function boot(){
  try{var L=localStorage.getItem("abnLang");if(L)LANG=L;}catch(e){}
  document.documentElement.dir=(LANG==="he"?"rtl":"ltr");
  drawNav();
  try{WOS=await all(T.wo);BOOT_FAILS=0;AUTH_ERR="";drawTabs();draw();document.getElementById("stamp").textContent=WOS.length+" כרטיסים";}
  catch(e){
    var msg=String(e.message||e);
    BOOTED=false;                       /* שניתן יהיה לנסות שוב אחרי התחברות */
    if(/\b(401|403)\b|PROXY_FORBIDDEN|Authorization|token/i.test(msg)){
      BOOT_FAILS++;
      try{var jm=((JSON.parse(msg)||{}).error||{}).message; if(jm)msg=jm;}catch(x){}
      AUTH_ERR=msg.slice(0,180);
      document.getElementById("list").innerHTML='<div class="empty">ההזדהות פגה או נדחתה — נא להתחבר מחדש'
        +'<br><span style="font-size:12px;color:var(--red);direction:ltr;display:inline-block;margin-top:8px;word-break:break-word">'+esc(AUTH_ERR)+'</span></div>';
      /* ⚠️ אחרי שלושה כישלונות עוצרים. השער מפעיל התחברות אוטומטית,
         ההתחברות מפעילה boot(), boot() נכשל — זו הלולאה של v19. */
      if(BOOT_FAILS<3){try{showGate();}catch(x){}}
      else{try{document.getElementById("gate").style.display="none";}catch(x){}}
      return;
    }
    document.getElementById("list").innerHTML='<div class="empty">\u05e9\u05d2\u05d9\u05d0\u05d4 \u05d1\u05d8\u05e2\u05d9\u05e0\u05d4: '+esc(msg)+'</div>';return;
  }
  try{LINES=await all(T.ln);if(CUR){pParts();try{pSvc();}catch(x){}pPay();}}catch(e){}
  loadSlots().then(function(){if(CUR)pDet();});
  try{SVC=(await all(T.svc)).map(function(r){var f=r.fields||{};return {id:r.id,name:f["שם שירות"]||"",price:f["מחיר שירות"]||0};});}catch(e){}
  try{LOC=(await all(T.loc)).map(function(r){return {id:r.id,name:(r.fields||{})["שם מיקום"]||""};});}catch(e){}
  await ensureEmp();
  if(VIEW!=="work")draw();
  document.getElementById("stamp").textContent=WOS.length+" כרטיסים · "+EMP.length+" עובדים · "+APP_VERSION;
  if(!ME.role){
    /* יש טוקן חי אבל אין תפקיד — משחזרים מהטוקן במקום לבקש הזדהות שוב */
    if(window.__idToken && window.__idEmail){
      __alog("boot ended with no role — recovering from token, no gate");
      try{signInWithEmail(window.__idEmail);}catch(e){__alog("recover failed: "+e);showGate();}
    } else { __alog("boot ended with no role and no token — showing gate"); showGate(); }
  } else {applyRole();greet();drawNav();drawTabs();draw();}
}
/* ============================================================================
   v41: סנכרון תשלומים חי
   ----------------------------------------------------------------------------
   תשלום אונליין מגיע מ-iCount (IPN) ל-Worker, שמעדכן את Airtable. האפליקציה לא ידעה על כך
   עד רענון ידני. עכשיו: כל 20 שניות (כשהלשונית פתוחה) וברגע החזרה ללשונית, נבדקים רק הכרטיסים
   שממתינים לתשלום. כשתשלום נקלט — הודעה, רענון הרשימה והכרטיס הפתוח, ואם הכרטיס עדיין
   "מוכן לתשלום" הוא עובר ל"שולם" (גיבוי למקרה שהשרת לא עדכן את סטטוס העבודה).
   ========================================================================== */
var PAY_POLL_MS=20000, PAY_BUSY=false, PAY_SKIP=0;
async function paySync(){
  if(PAY_BUSY||document.hidden||!ME||!ME.role||!WOS||!WOS.length)return;
  /* v46: כשהרענון החי פעיל, שינויי תשלום מגיעים ממילא — בודקים רק פעם בדקה (חוסך קריאות API) */
  if(typeof LIVE_OK!=="undefined"&&Date.now()-LIVE_OK<30000){PAY_SKIP=(PAY_SKIP+1)%3;if(PAY_SKIP)return;}
  var pend=WOS.filter(function(r){var f=r.fields||{},acc=txt(f["סטטוס חשבון"]);
    return acc==="נשלח לתשלום"||(acc==="שולם"&&txt(f["סטטוס"])==="מוכן לתשלום");});
  if(!pend.length)return;
  PAY_BUSY=true;
  try{
    var changed=false;
    for(var k=0;k<pend.length;k+=40){
      var ch=pend.slice(k,k+40);
      var fresh=await find(T.wo,"OR("+ch.map(function(r){return "RECORD_ID()="+q(r.id);}).join(",")+")",100);
      for(var i=0;i<fresh.length;i++){
        var d=fresh[i], f=d.fields||{}, idx=-1;
        WOS.forEach(function(x,n){if(x.id===d.id)idx=n;});
        var old=idx>=0?(WOS[idx].fields||{}):{};
        var wasPaid=txt(old["סטטוס חשבון"])==="שולם", isPaid=txt(f["סטטוס חשבון"])==="שולם";
        if(isPaid&&!wasPaid){
          toast("💳 התקבל תשלום · "+(f["שם להצגה"]||"")+(f["מספר חשבונית מס קבלה"]?" · חשבונית "+txt(f["מספר חשבונית מס קבלה"]):""));
        }
        if(isPaid&&txt(f["סטטוס"])==="מוכן לתשלום"&&can("money")){
          try{
            var r=await fetch(PX+B+"/"+T.wo+"/"+d.id,{method:"PATCH",headers:{"Content-Type":"application/json"},
              body:JSON.stringify({fields:{"סטטוס":"שולם"},typecast:true})});
            if(r.ok){var upd=await r.json(); d=upd; f=d.fields||{};}
          }catch(e){}
        }
        if(idx>=0&&JSON.stringify(old)!==JSON.stringify(f)){WOS[idx]=d;changed=true;
          if(CUR&&CUR.id===d.id){CUR=d;try{pDet();pPay();pCredit();headStatus();}catch(e){}}}
      }
    }
    if(changed){try{draw();drawTabs();}catch(e){}}
  }catch(e){}
  PAY_BUSY=false;
}
setInterval(paySync,PAY_POLL_MS);
/* ============================================================================
   v46 — רענון חי כל שנייה (30/09/2026)
   ----------------------------------------------------------------------------
   כל שנייה (כשהלשונית גלויה) שואלים את ה-Worker "מה השתנה" (/sync). ה-Worker
   פונה ל-Airtable פעם אחת בשנייה לכל המכשירים יחד — לכן זה לא חורג ממגבלת 5
   הבקשות לשנייה. מקבלים את כרטיסי העבודה ושורות החלפים/השירותים שהשתנו ב-20
   השניות האחרונות, וממזגים לתוך WOS / LINES.
   כללי ציור — כדי שהמסך לא יקפוץ:
     • הרשימה מצוירת מחדש רק אם משהו בה באמת השתנה.
     • כרטיס פתוח מתעדכן רק כשאף שדה בו לא בעריכה (פוקוס בתוך החלונית = מחכים).
     • 2.5 שניות אחרי כתיבה מקומית לא ממזגים — כדי שערך ישן לא "יקפוץ" חזרה.
   מחיקות אינן מופיעות ב"מה השתנה" — לכן אחת ל-5 דקות, ובחזרה ללשונית אחרי
   הפסקה, טעינה שקטה מלאה.
   ========================================================================== */
var LIVE_MS=1000, LIVE_BUSY=false, LIVE_OK=0, LIVE_FULL=0, LIVE_HOLD=0, LIVE_NEXT=0, LIVE_WIN=60, LIVE_PENDING_CARD=false;
var SYNC_URL="https://"+PROXY_HOST+"/sync";
function liveEditing(){var a=document.activeElement,ov=document.getElementById("ov");
  /* תיבת חיפוש החלפים אינה נחשבת עריכה — ציור מחדש לא נוגע בה */
  return !!(a&&ov&&ov.contains(a)&&a.id!=="pq"&&a.id!=="svQ"&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName));}
function liveMerge(arr,recs,skip){var ch=false,idx={};arr.forEach(function(r,i){idx[r.id]=i;});
  recs.forEach(function(d){if(skip&&skip[d.id])return;var i=idx[d.id];
    if(i==null){arr.push(d);idx[d.id]=arr.length-1;ch=true;}
    else if(JSON.stringify(arr[i].fields)!==JSON.stringify(d.fields)){arr[i]=d;ch=true;}});
  return ch;}
/* שורות שכרטיס העבודה שלהן כבר לא מקשר אליהן — נמחקו במכשיר אחר */
function livePrune(wos){var ch=false;
  wos.forEach(function(w){var keep=ids((w.fields||{})["➕ חלפים שהותקנו (עם כמות)"]);
    var n=LINES.length;
    LINES=LINES.filter(function(l){var wl=ids((l.fields||{})["כרטיס עבודה"]);return wl.indexOf(w.id)<0||keep.indexOf(l.id)>=0;});
    if(LINES.length!==n)ch=true;});
  return ch;}
function liveRepaintCard(){
  if(!CUR)return;
  if(liveEditing()){LIVE_PENDING_CARD=true;return;}
  LIVE_PENDING_CARD=false;
  try{pDet();}catch(e){} try{pParts();}catch(e){} try{pSvc();}catch(e){} try{pChecks();}catch(e){}
  try{pPay();}catch(e){} try{pCredit();}catch(e){} try{headStatus();}catch(e){}}
/* טעינה שקטה מלאה — רק אחרי היעדרות ארוכה מחלון "מה השתנה", ולכל היותר פעם ב-10 דקות (חוסך קריאות API) */
async function liveFull(){
  if(Date.now()-LIVE_FULL<600000)return false;
  LIVE_FULL=Date.now();var t0=Date.now();
  try{var W=await all(T.wo),L=await all(T.ln);
    if((window.__lastWrite||0)>t0)return true;       /* נכתב משהו בזמן הטעינה — לא דורסים */
    L=L.filter(function(l){return !LIVE_DEL[l.id];});
    WOS=W;LINES=L;
    if(CUR){var c=WOS.filter(function(r){return r.id===CUR.id;})[0];if(c)CUR=c;}
    try{draw();drawTabs();}catch(e){}
    liveRepaintCard();
    LIVE_OK=Date.now();return true;
  }catch(e){LIVE_HOLD=Date.now()+30000;return false;}}
async function liveSync(){
  if(LIVE_BUSY||document.hidden||!ME||!ME.role||!window.__idToken||!WOS.length)return;
  var now=Date.now();
  if(now<LIVE_HOLD||now<LIVE_NEXT)return;
  if(LIVE_PENDING_CARD&&!liveEditing())liveRepaintCard();
  LIVE_BUSY=true;
  try{
    var r=await fetch(SYNC_URL,{cache:"no-store"});
    if(!r.ok){LIVE_HOLD=Date.now()+(r.status===404?600000:10000);return;}   /* 404 = ה-Worker עוד לא עודכן */
    var d=await r.json();
    /* קצב הפנייה ל-Worker נגזר מקצב הרענון שלו — אין טעם לשאול מהר יותר */
    var iv=Number(d.interval)||20; LIVE_NEXT=Date.now()+Math.min(Math.max(iv*1000/4,LIVE_MS),5000);
    if(d.window)LIVE_WIN=Number(d.window);
    if(d.cooldown||d.error){LIVE_HOLD=Date.now()+Math.min(Number(d.retryMs)||10000,60000);return;}
    /* חזרה אחרי היעדרות ארוכה מחלון "מה השתנה" (או תשובה חלקית) — טעינה שקטה מלאה */
    if(d.full||(LIVE_OK&&Date.now()-LIVE_OK>(LIVE_WIN-5)*1000)){if(await liveFull())return;}
    var lw=window.__lastWrite||0;
    /* תמונת מצב שנלקחה לפני כתיבה מקומית אינה ממוזגת — אחרת ערך ישן "קופץ" חזרה */
    var wo=(Number(d.t)||0)>lw?(d.wo||[]):[], ln=(Number(d.lnAt)||0)>lw?(d.ln||[]):[];
    var chW=liveMerge(WOS,wo), chL=liveMerge(LINES,ln,LIVE_DEL);
    if(chW&&livePrune(wo))chL=true;
    if(chW){if(CUR){var c=WOS.filter(function(x){return x.id===CUR.id;})[0];if(c)CUR=c;}
      try{draw();drawTabs();}catch(e){}
      try{var st=document.getElementById("stamp");if(st)st.textContent=WOS.length+" כרטיסים";}catch(e){}}
    var curHit=CUR&&((chW&&wo.some(function(x){return x.id===CUR.id;}))||chL);
    if(curHit)liveRepaintCard();
    LIVE_OK=Date.now();
  }catch(e){LIVE_HOLD=Date.now()+10000;}
  finally{LIVE_BUSY=false;}
}
setInterval(liveSync,LIVE_MS);
document.addEventListener("focusout",function(){setTimeout(function(){if(LIVE_PENDING_CARD&&!liveEditing())liveRepaintCard();},300);});
document.addEventListener("visibilitychange",function(){if(!document.hidden)setTimeout(paySync,500);});

function reload(){document.getElementById("list").innerHTML='<div class="boot"><div class="sp">⏳</div><div style="margin-top:10px">מרענן…</div></div>';boot();}

/* ============================================================================
   סדר האתחול — קודם זהות, אחר כך נתונים
   ----------------------------------------------------------------------------
   עד כאן boot() נקרא מיד עם טעינת הדף, לפני שגוגל החזירה טוקן.
   הבקשה הראשונה יצאה בלי כותרת Authorization. כל עוד ה-Worker היה
   ב-AUTH_MODE=report הוא העביר אותה בכל זאת והכל עבד. ברגע שהאכיפה
   הופעלה, אותה בקשה מקבלת 401, boot() נופל ב-catch ועושה return —
   ולכן WOS, LINES, SVC, EMP נשארים ריקים. אחר כך ההתחברות מסתיימת,
   draw() דורס את הודעת השגיאה ב-"אין כרטיסים להצגה", והמשתמש רואה
   מסך ריק בלי שום רמז למה קרה.
   הבאג הזה קיים מ-WP-8; מצב report הסתיר אותו.
   ========================================================================== */
var BOOTED=false, BOOT_FAILS=0;
function bootOnce(){ if(BOOTED)return; BOOTED=true; boot(); }
function bootWhenReady(){
  try{var L=localStorage.getItem("abnLang");if(L)LANG=L;}catch(e){}
  document.documentElement.dir=(LANG==="he"?"rtl":"ltr");
  try{drawNav();}catch(e){}
  if(LANG!=="he"){trStart();trNode(document.body);}
  if(window.__idToken){bootOnce();return;}
  /* ⚠️ אין להמתין כאן לטוקן בלולאה. showGate() הוא זה שמאתחל את ספריית
     גוגל ומפעיל את החידוש השקט — המתנה לפניו פירושה המתנה למשהו שעוד
     לא התחיל. הטוקן מגיע באירוע (onGoogle), לא בסקר. */
  showGate();
}
bootWhenReady();
